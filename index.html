<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1026">
<title>BTC Farming Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Orbitron:wght@700;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
<style>
:root{--gold:#ffbe3d;--gold2:#ffe7ae;--gold3:#d6830a;--txt:#f5f7ff;--mut:#a3aed0;--red:#ff5c7a;--ok:#3ddc97;--rim:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.1),inset 1px 0 0 rgba(255,255,255,.14);--g:radial-gradient(90% 60% at 4% 0,rgba(255,255,255,.24),transparent 58%),radial-gradient(70% 70% at 100% 100%,rgba(155,107,255,.18),transparent 70%),linear-gradient(150deg,rgba(255,255,255,.17),rgba(255,255,255,.04) 50%,rgba(255,255,255,.08))}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Sora',system-ui,sans-serif;background:#070b1c;color:var(--txt);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(38% 34% at 10% 8%,rgba(247,147,26,.45),transparent 70%),radial-gradient(36% 32% at 95% 26%,rgba(155,107,255,.4),transparent 70%),radial-gradient(40% 36% at 80% 94%,rgba(91,208,255,.28),transparent 70%),linear-gradient(180deg,#0a0f2c,#050817)}
button,input{font-family:inherit}
.hidden{display:none!important}
.gt{background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.glass{background:var(--g);border:1px solid rgba(255,255,255,.14);box-shadow:0 16px 40px rgba(2,4,20,.5),var(--rim);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border-radius:24px}
.btn{border:0;cursor:pointer;font-weight:700;font-size:12px;letter-spacing:.6px;color:#2a1c00;border-radius:13px;padding:0 14px;height:38px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 52%),linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold3));box-shadow:0 8px 18px rgba(255,190,61,.28),inset 0 1px 0 rgba(255,255,255,.8);transition:transform .15s}
.btn:active{transform:scale(.95)}.btn:disabled{filter:grayscale(.8) brightness(.7)}
.btn.ok{background:linear-gradient(180deg,#9bf5cc,#3ddc97);color:#032a18;box-shadow:0 8px 18px rgba(61,220,151,.25)}
.btn.bad{background:linear-gradient(180deg,#ff9db0,#ff5c7a);color:#2a0009;box-shadow:0 8px 18px rgba(255,92,122,.25)}
.btn.gl{background:rgba(255,255,255,.1);color:var(--gold2);border:1px solid rgba(255,190,61,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
input{width:100%;height:50px;border-radius:17px;border:1px solid rgba(255,255,255,.22);background:linear-gradient(150deg,rgba(255,255,255,.13),rgba(255,255,255,.04));box-shadow:inset 0 2px 10px rgba(0,0,0,.3);color:var(--txt);padding:0 16px;font-size:14px;margin-bottom:12px}
input:focus{outline:0;border-color:var(--gold);box-shadow:inset 0 2px 8px rgba(0,0,0,.2),0 0 0 3px rgba(255,190,61,.22)}
input::placeholder{color:#8a96bd}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{width:100%;max-width:370px;padding:28px 22px;text-align:center}
.lbox h1{font-family:'Orbitron',sans-serif;font-size:22px;letter-spacing:3px;margin:6px 0 4px}
.lbox p{color:var(--mut);font-size:13px;margin-bottom:18px}
.lbox .btn{width:100%;height:50px;font-size:15px}
.logo{width:84px;height:84px;margin:0 auto 6px;display:block;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.3),0 0 0 4px rgba(247,147,26,.45),0 0 28px rgba(247,147,26,.6)}
/* layout */
#top{position:fixed;top:0;left:0;right:0;height:58px;z-index:30;display:flex;align-items:center;gap:12px;padding:0 12px;background:linear-gradient(180deg,rgba(18,26,62,.75),rgba(10,14,36,.45));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.16)}
#top .mn{width:38px;height:38px;border-radius:13px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:var(--gold2);cursor:pointer;font-size:16px}
#top b{font-family:'Orbitron',sans-serif;letter-spacing:2px;font-size:15px}
#side{position:fixed;top:58px;bottom:0;left:0;width:240px;z-index:25;padding:14px 12px;display:flex;flex-direction:column;gap:8px;border-radius:0 26px 26px 0;transform:translateX(-102%);transition:transform .35s cubic-bezier(.3,1.2,.5,1)}
#side.open{transform:none}
#side button{height:48px;border-radius:17px;border:1px solid transparent;background:none;color:var(--mut);display:flex;align-items:center;gap:12px;padding:0 14px;font-weight:700;font-size:12.5px;letter-spacing:1px;cursor:pointer;text-align:left}
#side button i{width:20px;text-align:center;font-size:16px}
#side button.on{color:#fff3c7;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,190,61,.14));border-color:rgba(255,190,61,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 18px rgba(255,190,61,.2)}
#side .sp{flex:1}
main{padding:74px 12px 30px;max-width:900px;margin:0 auto}
@media(min-width:900px){#side{transform:none}#top .mn{display:none}main{margin-left:260px;max-width:none;padding-right:24px}}
h2{font-family:'Orbitron',sans-serif;font-size:18px;letter-spacing:2px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:900px){.stats{grid-template-columns:repeat(4,1fr)}}
.st{padding:18px 14px;text-align:center}
.st i{font-size:22px;color:var(--gold);margin-bottom:8px;filter:drop-shadow(0 0 8px rgba(255,190,61,.5))}
.st small{display:block;font-size:10.5px;font-weight:700;letter-spacing:1.4px;color:var(--mut)}
.st b{display:block;font-family:'Orbitron',sans-serif;font-size:24px;margin-top:4px}
.st em{display:block;font-style:normal;font-size:10.5px;color:var(--mut);margin-top:3px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs .btn{flex:1}
.row{padding:14px;margin-bottom:12px}
.gridn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.gridn div{min-width:0}
.gridn small{display:block;font-size:9.5px;font-weight:700;letter-spacing:1.2px;color:var(--mut)}
.gridn span{display:block;font-size:12.5px;font-weight:600;word-break:break-all;margin-top:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{height:34px;font-size:11px;flex:1 1 auto}
.addr{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:15px;background:rgba(0,0,0,.3);border:1px dashed rgba(255,190,61,.5);margin:8px 0 10px}
.addr span{flex:1;font-size:12px;word-break:break-all;color:var(--gold2);font-weight:600}
.addr .btn{height:32px;flex:none}
.hs{font-weight:700;font-size:10.5px;letter-spacing:.6px;padding:2px 9px;border-radius:20px;border:1px solid currentColor}
.hs.pend{color:var(--gold)}.hs.ok{color:var(--ok)}.hs.bad{color:var(--red)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:6px}
.up{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:17px;border:1px dashed rgba(255,190,61,.55);background:rgba(255,255,255,.05);color:var(--gold2);font-weight:700;font-size:12.5px;letter-spacing:1.3px;cursor:pointer;margin-bottom:12px}
.up.ok{border-style:solid;border-color:var(--ok);color:var(--ok)}
.pv{width:72px;height:72px;border-radius:18px;object-fit:cover;display:block;margin:0 auto 12px;border:1px solid rgba(255,255,255,.3)}
.ti{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px}
.ti img,.ti .ph{width:46px;height:46px;border-radius:15px;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);color:var(--gold)}
.ti div{flex:1;min-width:0;font-size:13px;font-weight:700}.ti small{display:block;color:var(--mut);font-weight:500;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.no{text-align:center;color:var(--mut);font-size:13px;padding:20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:60;max-width:90%;padding:12px 20px;border-radius:30px;font-size:13px;font-weight:600;background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(20,28,58,.88));border:1px solid rgba(255,255,255,.26);opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.ok{border-color:var(--ok);color:var(--ok)}#toast.err{border-color:var(--red);color:#ffb3c1}
</style>
</head>
<body>

<section id="login" class="hidden">
  <form class="glass lbox" id="lf" autocomplete="off">
    <img class="logo" id="lg" alt="">
    <h1 class="gt">ADMIN</h1><p>Login to the BTC Farming admin panel</p>
    <input id="lm" type="email" placeholder="EMAIL" autocomplete="username">
    <input id="lp" type="password" placeholder="PASSWORD" autocomplete="current-password">
    <button class="btn" type="submit">LOGIN</button>
  </form>
</section>

<div id="panel" class="hidden">
  <header id="top"><button class="mn" id="mn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button><b class="gt">BTC FARMING ADMIN</b></header>
  <nav id="side" class="glass">
    <button data-p="dash" class="on"><i class="fa-solid fa-gauge-high"></i>DASHBOARD</button>
    <button data-p="wd"><i class="fa-solid fa-money-bill-transfer"></i>WITHDRAW REQUEST</button>
    <button data-p="users"><i class="fa-solid fa-users"></i>USER'S</button>
    <button data-p="add"><i class="fa-solid fa-square-plus"></i>ADD TASK</button>
    <div class="sp"></div>
    <button id="out" style="color:#ff8fa3"><i class="fa-solid fa-right-from-bracket"></i>LOGOUT</button>
  </nav>
  <main>
    <section id="p-dash">
      <h2 class="gt">DASHBOARD</h2>
      <div class="stats">
        <div class="glass st"><i class="fa-solid fa-users"></i><small>USER'S</small><b id="sU">0</b></div>
        <div class="glass st"><i class="fa-solid fa-list-check"></i><small>TOTAL TASKS</small><b id="sT">0</b></div>
        <div class="glass st"><i class="fa-solid fa-user-group"></i><small>TOTAL REFER</small><b id="sR">0</b><em id="sR2"></em></div>
        <div class="glass st"><i class="fa-solid fa-circle-play"></i><small>TOTAL WATCH AD CLICK</small><b id="sW">0</b></div>
      </div>
    </section>
    <section id="p-wd" class="hidden">
      <h2 class="gt">WITHDRAW REQUEST</h2>
      <div class="tabs"><button class="btn" id="tB">BTC</button><button class="btn gl" id="tD">BABY DOGE</button></div>
      <div id="wdList"></div>
    </section>
    <section id="p-users" class="hidden"><h2 class="gt">USER'S</h2><div id="uList"></div></section>
    <section id="p-add" class="hidden">
      <h2 class="gt">ADD TASK</h2>
      <form class="glass row" id="tf" autocomplete="off">
        <input type="file" id="timg" accept="image/*" hidden>
        <label class="up" id="tup" for="timg"><i class="fa-solid fa-cloud-arrow-up"></i><span id="tupT">UPLOAD IMAGE</span></label>
        <img id="tpv" class="pv hidden" alt="">
        <input id="tt" type="text" placeholder="TITLE" maxlength="60">
        <input id="tl" type="text" placeholder="LINK" spellcheck="false">
        <input id="tr" type="text" inputmode="decimal" placeholder="REWARD IN BTC (MINIMUM 0.000000013 BTC)">
        <input id="tb" type="text" placeholder="BUTTON (example: OPEN)" maxlength="14">
        <button class="btn" style="width:100%;height:50px;font-size:14px" type="submit">ADD TASK</button>
      </form>
      <h2 class="gt" style="font-size:15px">ALL TASKS</h2>
      <div id="tList"></div>
    </section>
  </main>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOGO = 'data:image/svg+xml;utf8,' + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#ffb347'/><stop offset='1' stop-color='#f7931a'/></linearGradient></defs><circle cx='50' cy='50' r='50' fill='url(#g)'/><g transform='rotate(14 50 50)' fill='none' stroke='#fff' stroke-width='6.5' stroke-linecap='round' stroke-linejoin='round'><path d='M38 29H55A10.5 10.5 0 0 1 55 50H38M38 50H58A10.5 10.5 0 0 1 58 71H38M38 29V71M46 20V29M56 20V29M46 71V80M56 71V80'/></g></svg>");
$('#lg').src = LOGO;
const ic = document.createElement('link'); ic.rel = 'icon'; ic.href = LOGO; document.head.appendChild(ic);

var _P = [
  "0VflDQQu_N7ebc5nOF7uRoUQtjT6Ha9nCySazIA",
  "moc.ppaesaberif.c5997-gnimrafctb",
  "moc.oiesaberif.bdtr-tluafed-c5997-gnimrafctb//:sptth",
  "c5997-gnimrafctb",
  "ppa.egarotsesaberif.c5997-gnimrafctb",
  "914041001948",
  "6b0146fc553f386a72c065:bew:914041001948:1"
];
function _d(s){ var o=''; for(var i=s.length-1;i>=0;i--) o += s.charAt(i); return o; }
var db = null;
try{
  firebase.initializeApp({apiKey:_d(_P[0]),authDomain:_d(_P[1]),databaseURL:_d(_P[2]),projectId:_d(_P[3]),storageBucket:_d(_P[4]),messagingSenderId:_d(_P[5]),appId:_d(_P[6])});
  db = firebase.database();
}catch(e){ db = null; }

const ADM_MAIL = 'ffmg723@gmail.com', ADM_PASS = 'MONU MANFORCE', SKEY = 'btc_admin', MIN_R = 0.000000013, REF_TASKS = 2;
let users = {}, tasks = {}, wd = {}, bd = {}, tab = 'btc', img = '';
const fmt = n => (Number(n) || 0).toFixed(9);
const fB = n => Math.floor(Number(n) || 0).toLocaleString('en-US');
let tt;
function toast(m, t){ const e = $('#toast'); e.textContent = m; e.className = 'show ' + (t || ''); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('show'), 3000); }
const date = t => t ? new Date(Number(t)).toLocaleString() : '—';

/* login */
function enter(){ $('#login').classList.add('hidden'); $('#panel').classList.remove('hidden'); listen(); }
$('#lf').addEventListener('submit', e => {
  e.preventDefault();
  if($('#lm').value.trim().toLowerCase() === ADM_MAIL && $('#lp').value === ADM_PASS){ try{ localStorage.setItem(SKEY, '1'); }catch(x){} enter(); }
  else toast('Wrong email or password', 'err');
});
$('#out').onclick = () => { try{ localStorage.removeItem(SKEY); }catch(x){} location.reload(); };

/* nav */
const side = $('#side');
$('#mn').onclick = () => side.classList.toggle('open');
document.querySelectorAll('#side button[data-p]').forEach(b => b.onclick = () => {
  document.querySelectorAll('#side button[data-p]').forEach(x => x.classList.toggle('on', x === b));
  ['dash','wd','users','add'].forEach(p => $('#p-' + p).classList.toggle('hidden', p !== b.dataset.p));
  side.classList.remove('open'); window.scrollTo(0, 0);
});

function listen(){
  if(!db) return toast('Firebase not connected', 'err');
  db.ref('users').on('value', s => { users = s.val() || {}; rUsers(); rDash(); }, e => toast('Users: ' + e.message, 'err'));
  db.ref('tasks').on('value', s => { tasks = s.val() || {}; rTasks(); rDash(); });
  db.ref('withdrawRequests').on('value', s => { wd = s.val() || {}; rWd(); });
  db.ref('babyDogeWithdrawRequests').on('value', s => { bd = s.val() || {}; rWd(); });
}

/* dashboard */
function referCount(){
  const m = {}; let tot = 0, ok = 0;
  Object.keys(users).forEach(id => { const u = users[id]; if(u.refBy){ tot++; if((Number(u.tasks) || 0) >= REF_TASKS) ok++; const k = u.refBy; m[k] = m[k] || {t:0, s:0}; m[k].t++; if((Number(u.tasks) || 0) >= REF_TASKS) m[k].s++; } });
  return {m, tot, ok};
}
function rDash(){
  const r = referCount();
  $('#sU').textContent = Object.keys(users).length; $('#sT').textContent = Object.keys(tasks).length;
  $('#sR').textContent = r.tot; $('#sR2').textContent = r.ok + ' successful';
  $('#sW').textContent = Object.keys(users).reduce((a, id) => a + (Number(users[id].watch) || 0), 0);
}

/* withdraw requests */
$('#tB').onclick = () => { tab = 'btc'; $('#tB').classList.remove('gl'); $('#tD').classList.add('gl'); rWd(); };
$('#tD').onclick = () => { tab = 'bd'; $('#tD').classList.remove('gl'); $('#tB').classList.add('gl'); rWd(); };
function rWd(){
  const src = tab === 'btc' ? wd : bd;
  const arr = Object.keys(src).map(k => Object.assign({id:k}, src[k])).sort((a,b) => (Number(b.time)||0) - (Number(a.time)||0));
  $('#wdList').innerHTML = arr.length ? arr.map(r => {
    const st = String(r.status || 'pending').toLowerCase(), c = st === 'approved' ? 'ok' : st === 'rejected' ? 'bad' : 'pend';
    const amt = tab === 'btc' ? fmt(r.amount) + ' BTC' : fB(r.amount) + ' BABY DOGE';
    return '<div class="glass row"><div class="top"><span>' + esc(r.name || 'User') + '</span><span class="hs ' + c + '">' + st.toUpperCase() + '</span></div>' +
      '<div class="gridn"><div><small>AMOUNT</small><span>' + amt + '</span></div><div><small>EMAIL</small><span>' + esc(r.email || '—') + '</span></div><div><small>DATE</small><span>' + date(r.time) + '</span></div></div>' +
      '<small style="font-size:9.5px;font-weight:700;letter-spacing:1.2px;color:var(--mut)">ADDRESS</small><div class="addr"><span>' + esc(r.address) + '</span><button class="btn gl" data-c="' + esc(r.address) + '"><i class="fa-solid fa-copy"></i></button></div>' +
      (st === 'pending' ? '<div class="acts"><button class="btn ok" data-a="approved" data-id="' + esc(r.id) + '">APPROVE</button><button class="btn bad" data-a="rejected" data-id="' + esc(r.id) + '">REJECT</button></div>' : '') + '</div>';
  }).join('') : '<div class="no">No requests yet</div>';
}
$('#wdList').addEventListener('click', e => {
  const c = e.target.closest('[data-c]');
  if(c){ const t = c.dataset.c; if(navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Copied', 'ok')); return; }
  const b = e.target.closest('[data-a]'); if(!b) return;
  const isBd = tab === 'bd', path = isBd ? 'babyDogeWithdrawRequests' : 'withdrawRequests', r = (isBd ? bd : wd)[b.dataset.id], st = b.dataset.a;
  if(!r) return;
  if(!confirm((st === 'approved' ? 'Approve' : 'Reject and refund') + ' this request?')) return;
  const ref = db.ref(path + '/' + b.dataset.id);
  ref.child('status').transaction(c => (!c || c === 'pending') ? st : undefined).then(res => {
    if(!res.committed) return toast('Already processed', 'err');
    ref.update({processedAt:Date.now()});
    if(st === 'rejected' && r.uid){
      db.ref('users/' + r.uid).once('value').then(s => {
        if(!s.exists()) return;
        db.ref('users/' + r.uid + '/' + (isBd ? 'babyDoge' : 'balance')).transaction(v => isBd ? Math.floor((Number(v) || 0) + Number(r.amount)) : +((Number(v) || 0) + Number(r.amount)).toFixed(9));
      });
    }
    toast(st === 'approved' ? 'Approved. Shows SUCCESS in app' : 'Rejected and refunded', 'ok');
  }).catch(err => toast(err.message, 'err'));
});

/* users */
function rUsers(){
  const rc = referCount().m;
  const arr = Object.keys(users).map(k => Object.assign({id:k}, users[k])).sort((a,b) => (Number(b.lastLogin)||0) - (Number(a.lastLogin)||0));
  $('#uList').innerHTML = arr.length ? arr.map(u => {
    const blk = u.blocked === true || u.isBlocked === true || String(u.status || '').toLowerCase() === 'blocked', r = rc[u.code] || {t:0, s:0};
    return '<div class="glass row"><div class="gridn"><div><small>USERNAME</small><span>' + esc(u.name || '—') + '</span></div><div><small>BALANCE</small><span>' + fmt(u.balance) + ' BTC</span></div><div><small>LAST LOGIN DATE</small><span>' + date(u.lastLogin) + '</span></div>' +
      '<div><small>EMAIL</small><span>' + esc(u.email || '—') + '</span></div><div><small>TOTAL REFER</small><span>' + r.t + ' (' + r.s + ' successful)</span></div><div><small>TOTAL WATCH AD</small><span>' + (Number(u.watch) || 0) + '</span></div></div>' +
      '<div class="acts"><button class="btn ok" data-u="inc" data-id="' + esc(u.id) + '">INCREASE BTC</button><button class="btn gl" data-u="dec" data-id="' + esc(u.id) + '">DECREASE BTC</button>' +
      '<button class="btn ' + (blk ? 'ok' : 'gl') + '" data-u="blk" data-id="' + esc(u.id) + '">' + (blk ? 'UNBLOCK' : 'BLOCK') + '</button><button class="btn bad" data-u="del" data-id="' + esc(u.id) + '">DELETE USER</button></div></div>';
  }).join('') : '<div class="no">No users yet</div>';
}
$('#uList').addEventListener('click', e => {
  const b = e.target.closest('[data-u]'); if(!b) return;
  const id = b.dataset.id, u = users[id], a = b.dataset.u; if(!u) return;
  if(a === 'inc' || a === 'dec'){
    const v = parseFloat(prompt((a === 'inc' ? 'Increase' : 'Decrease') + ' BTC for ' + (u.name || 'user') + '. Enter amount:'));
    if(!(v > 0)) return;
    db.ref('users/' + id + '/balance').transaction(c => { const n = (Number(c) || 0) + (a === 'inc' ? v : -v); return +Math.max(0, n).toFixed(9); })
      .then(() => toast('Balance updated', 'ok')).catch(err => toast(err.message, 'err'));
  }else if(a === 'blk'){
    const blk = u.blocked === true || u.isBlocked === true || String(u.status || '').toLowerCase() === 'blocked';
    db.ref('users/' + id).update({blocked:!blk, isBlocked:!blk, status:blk ? 'active' : 'blocked'}).then(() => toast(blk ? 'User unblocked' : 'User blocked', 'ok'));
  }else if(a === 'del'){
    if(confirm('Delete ' + (u.name || 'this user') + ' permanently?')) db.ref('users/' + id).remove().then(() => toast('User deleted', 'ok'));
  }
});

/* tasks */
$('#timg').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = () => { const im = new Image(); im.onload = () => {
    const m = 128, s = Math.min(1, m / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.width * s)); c.height = Math.max(1, Math.round(im.height * s));
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); img = c.toDataURL('image/png');
    $('#tpv').src = img; $('#tpv').classList.remove('hidden'); $('#tup').classList.add('ok'); $('#tupT').textContent = 'IMAGE ADDED'; };
    im.onerror = () => toast('Could not read image', 'err'); im.src = fr.result; };
  fr.readAsDataURL(f);
});
$('#tf').addEventListener('submit', e => {
  e.preventDefault();
  const title = $('#tt').value.trim(), link = $('#tl').value.trim(), r = parseFloat($('#tr').value), btn = $('#tb').value.trim() || 'OPEN';
  if(!img) return toast('Upload an image', 'err');
  if(!title) return toast('Enter the title', 'err');
  if(link.length < 4) return toast('Enter the link', 'err');
  if(!(r >= MIN_R)) return toast('Minimum reward is 0.000000013 BTC', 'err');
  const id = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  db.ref('tasks/' + id).set({title, link, reward:+r.toFixed(9), button:btn, image:img, time:Date.now()}).then(() => {
    toast('Task added. It is live in the app', 'ok'); $('#tf').reset(); img = ''; $('#tpv').classList.add('hidden'); $('#tup').classList.remove('ok'); $('#tupT').textContent = 'UPLOAD IMAGE';
  }).catch(err => toast(err.message, 'err'));
});
function rTasks(){
  const arr = Object.keys(tasks).map(k => Object.assign({id:k}, tasks[k])).sort((a,b) => (Number(b.time)||0) - (Number(a.time)||0));
  $('#tList').innerHTML = arr.length ? arr.map(t => '<div class="glass ti">' + (t.image ? '<img src="' + esc(t.image) + '" alt="">' : '<span class="ph"><i class="fa-solid fa-star"></i></span>') + '<div>' + esc(t.title) + '<small>' + fmt(t.reward) + ' BTC · ' + esc(t.button || 'OPEN') + ' · ' + esc(t.link) + '</small></div><button class="btn bad" data-d="' + esc(t.id) + '">DELETE</button></div>').join('') : '<div class="no">No tasks yet</div>';
}
$('#tList').addEventListener('click', e => {
  const b = e.target.closest('[data-d]'); if(!b) return;
  if(confirm('Delete this task?')) db.ref('tasks/' + b.dataset.d).remove().then(() => toast('Task deleted', 'ok'));
});

try{ if(localStorage.getItem(SKEY) === '1') enter(); else $('#login').classList.remove('hidden'); }catch(x){ $('#login').classList.remove('hidden'); }
})();
