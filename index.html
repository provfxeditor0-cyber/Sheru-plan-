<style>
:root{--ink:#0a2a55;--mut:#51709a;--blue:#1c7cff;--sky:#35b4ff;--ok:#0e9f6e;--red:#e5384f;
--gs:0 14px 34px rgba(25,85,170,.22),inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1.5px 0 rgba(255,255,255,.35),inset 0 0 24px rgba(255,255,255,.3);
--gl:linear-gradient(135deg,rgba(255,255,255,.66),rgba(255,255,255,.22));--gb:1px solid rgba(255,255,255,.75);--in:inset 0 2px 7px rgba(30,90,170,.18)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;font-family:'Manrope',system-ui,sans-serif;font-weight:700;color:var(--ink);background:linear-gradient(160deg,#dcf0ff,#8ccbff 55%,#eaf6ff) fixed}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(50px);opacity:.8}
body::before{width:60vmax;height:60vmax;left:-20vmax;top:-18vmax;background:radial-gradient(circle,#fff,#52b8ff 60%,transparent 70%)}
body::after{width:55vmax;height:55vmax;right:-22vmax;bottom:-18vmax;background:radial-gradient(circle,#c3b6ff,#2f7dff 55%,transparent 70%)}
.hidden{display:none!important}
button,input{font-family:inherit}
.gt{background:linear-gradient(180deg,#2d8bff,#0b3d94);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--blue)}
.clay,.item,.tabs button{background:var(--gl);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border:var(--gb);box-shadow:var(--gs)}
.clay{border-radius:28px}
.btn{border:0;cursor:pointer;font-weight:800;font-size:12px;letter-spacing:.6px;color:#fff;border-radius:14px;padding:0 16px;height:36px;background:linear-gradient(135deg,#5cc4ff,#1c6fff);text-shadow:0 1px 2px rgba(0,50,140,.45);box-shadow:0 6px 14px rgba(28,110,255,.4),inset 0 1.5px 0 rgba(255,255,255,.8),inset 0 -3px 7px rgba(0,60,170,.35)}
.btn:active{transform:scale(.96)}
.btn.ok{background:linear-gradient(135deg,#7ee8bd,#12a870);box-shadow:0 6px 14px rgba(18,168,112,.4),inset 0 1.5px 0 rgba(255,255,255,.8),inset 0 -3px 7px rgba(0,100,60,.35)}
.btn.no{background:linear-gradient(135deg,#ff9aa8,#e5384f);box-shadow:0 6px 14px rgba(229,56,79,.4),inset 0 1.5px 0 rgba(255,255,255,.8),inset 0 -3px 7px rgba(140,0,30,.35)}
.btn.sm{height:30px;font-size:11px;padding:0 12px;border-radius:12px}
input[type=text],input[type=password],input[type=email],input[type=datetime-local]{width:100%;height:50px;border-radius:19px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.5);color:var(--ink);padding:0 18px;font-size:14px;font-weight:700;margin-bottom:12px;box-shadow:var(--in)}
input:focus{outline:0;box-shadow:var(--in),0 0 0 3px rgba(53,180,255,.5)}
input::placeholder{color:#7f9bbf}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .clay{width:100%;max-width:370px;padding:30px 24px;text-align:center}
.brand{font-family:'Sora',sans-serif;font-weight:800;font-size:23px;letter-spacing:3px;margin-bottom:12px}
.llogo{width:84px;height:84px;border-radius:50%;border:3px solid #fff;box-shadow:0 8px 20px rgba(28,110,255,.35);margin-bottom:8px}
.wrap{max-width:920px;margin:0 auto;padding:16px 14px 50px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:6px 4px 14px;margin-bottom:6px}
.tabs button{flex:none;height:42px;padding:0 18px;border-radius:21px;color:var(--mut);font-weight:800;font-size:12px;letter-spacing:.5px;cursor:pointer}
.tabs button.on{color:#fff;background:linear-gradient(135deg,#5cc4ff,#1c6fff)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.stat{padding:20px}.stat span{font-size:12px;color:var(--mut);font-weight:800;letter-spacing:1px}
.stat b{display:block;font-family:'Sora',sans-serif;font-size:26px;font-weight:800;margin-top:6px;line-height:1.2}
.stat small{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.box{padding:20px;margin-bottom:18px}
.box h3{font-family:'Sora',sans-serif;font-size:15px;font-weight:800;letter-spacing:1px;margin-bottom:12px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;margin-top:12px;border-radius:22px;font-size:13px;box-shadow:0 6px 16px rgba(25,85,170,.14),inset 0 1px 0 #fff}
.item .m{min-width:0;flex:1}.item .m b{font-weight:800}
.item .m small{display:block;color:var(--mut);font-size:11.5px;margin-top:3px;word-break:break-all;line-height:1.5}
.item .a{display:flex;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.item.u{flex-direction:column;align-items:stretch}.item.u .a{justify-content:flex-start}
.tag{font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:14px;white-space:nowrap}
.t-ok{color:#0b7a52;background:rgba(190,245,220,.85)}.t-bad{color:#b02640;background:rgba(255,205,213,.85)}.t-p{color:#9a6200;background:rgba(255,226,150,.8)}
.pimg{flex:none;width:52px;height:52px;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--blue);background:rgba(255,255,255,.6);box-shadow:var(--in)}
.pimg img{width:100%;height:100%;object-fit:cover}
.up{display:flex;align-items:center;gap:14px;margin-bottom:12px}.up .pimg{width:68px;height:68px}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:18px}
.cnt{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);padding:13px 22px;border-radius:26px;background:rgba(255,255,255,.88);font-size:13px;font-weight:800;border:var(--gb);box-shadow:var(--gs);opacity:0;pointer-events:none;transition:.25s;z-index:30}
#toast.show{opacity:1}
#shotView{position:fixed;inset:0;z-index:20;background:rgba(10,30,70,.82);display:flex;align-items:center;justify-content:center;padding:14px;cursor:zoom-out}
#shotView img{max-width:100%;max-height:100%;border-radius:18px}
</style>
</head>

<script>
(function(){
'use strict';
const ADMIN_EMAIL = 'ffmg723@gmail.com';
const ADMIN_PASS  = 'MONU MANFORCE';

var _P = [
  "8IBlqMmC0bJIIt_AAXQZdY4UvHrmMpS4DySazIA",
  "moc.ppaesaberif.09186-urehs",
  "moc.oiesaberif.bdtr-tluafed-09186-urehs//:sptth",
  "09186-urehs",
  "ppa.egarotsesaberif.09186-urehs",
  "214133668652",
  "100f07de26f0656369330f:bew:214133668652:1"
];
function _d(s){ var o=''; for(var i=s.length-1;i>=0;i--) o += s.charAt(i); return o; }
var db = null;
try{
  firebase.initializeApp({apiKey:_d(_P[0]),authDomain:_d(_P[1]),databaseURL:_d(_P[2]),projectId:_d(_P[3]),storageBucket:_d(_P[4]),messagingSenderId:_d(_P[5]),appId:_d(_P[6])});
  db = firebase.database();
}catch(e){ db = null; }

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2800); };
const fdate = t => t ? new Date(Number(t)).toLocaleString('en-IN', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '-';
const SYM = {INR:'₹', USDT:'$'};
const OK = ['approved','success','completed','paid'], BAD = ['rejected','failed','declined','cancelled'];
const okUrl = u => /^https?:\/\/[^\s]+$/i.test(String(u || ''));
const okImg = s => /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(String(s || ''));
const D = {users:{}, deps:{}, wds:{}, tours:{}, aT:{}, uT:{}};
const vals = o => Object.keys(o || {}).map(k => Object.assign({_k:k}, o[k]));
const st = r => { const s = String(r.status || '').toLowerCase(); return OK.indexOf(s) > -1 ? 'ok' : (BAD.indexOf(s) > -1 ? 'bad' : 'p'); };

/* ---- login ---- */
function openPanel(){ $('#login').classList.add('hidden'); $('#panel').classList.remove('hidden'); listen(); }
$('#lGo').onclick = () => {
  if($('#lEmail').value.trim().toLowerCase() === ADMIN_EMAIL.toLowerCase() && $('#lPass').value === ADMIN_PASS){
    try{ sessionStorage.setItem('sp_admin', '1'); }catch(e){}
    openPanel();
  }else toast('Wrong email or password');
};
$('#logout').onclick = () => { try{ sessionStorage.removeItem('sp_admin'); }catch(e){} location.reload(); };
$('#lPass').addEventListener('keydown', e => { if(e.key === 'Enter') $('#lGo').click(); });
const TABS = ['dash','users','inr','usdt','wd','tour','tasks'];
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  TABS.forEach(id => $('#' + id).classList.toggle('hidden', id !== b.dataset.t));
});


/* ---- live data ---- */
function listen(){
  if(!db) return toast('Database not connected');
  [['users','users'],['depositRequests','deps'],['withdrawRequests','wds'],['tournaments','tours'],['adminTasks','aT'],['userTasks','uT']].forEach(a =>
    db.ref(a[0]).on('value', s => { D[a[1]] = s.val() || {}; render(); }, err => toast('Database error: ' + err.message)));
}
function depRows(cur){
  const ds = vals(D.deps).filter(r => r.currency === cur).sort((a, b) => (b.time || 0) - (a.time || 0));
  return ds.length ? ds.slice(0, 120).map(r => {
    const s = st(r);
    return '<div class="item"><div class="m"><b>' + esc(r.name || 'User') + ' · ' + SYM[cur] + esc(r.amount) + '</b><small>' + fdate(r.time) + ' · ' + esc(r.method || '') + ' · ID: ' + esc(r.txId || '') + '</small></div>' +
      '<div class="a">' + (r.hasShot ? '<button class="btn sm" data-shot="' + esc(r._k) + '"><i class="fa-solid fa-image"></i> SCREENSHOT</button>' : '') + (s === 'p' ? '<button class="btn sm ok" data-dep="' + esc(r._k) + '" data-v="approved">APPROVE</button><button class="btn sm no" data-dep="' + esc(r._k) + '" data-v="rejected">REJECT</button>'
      : '<span class="tag t-' + s + '">' + (s === 'ok' ? 'APPROVED' : 'REJECTED') + '</span>') + '</div></div>';
  }).join('') : '<div class="empty">No ' + cur + ' deposit requests</div>';
}
function wdRows(){
  const ws = vals(D.wds).sort((a, b) => (b.time || 0) - (a.time || 0));
  return ws.length ? ws.slice(0, 150).map(r => {
    const s = st(r), sy = SYM[r.currency] || '$';
    return '<div class="item u"><div class="m"><b>NAME: ' + esc(r.name || 'User') + '</b>' +
      '<small>ADDRESS: ' + esc(r.address || '') + '</small>' +
      '<small>AMOUNT: <b>' + sy + esc(r.amount) + '</b>' + (r.currency === 'INR' ? ' (about $' + esc(r.usd) + ' USDT)' : ' USDT') + ' · ' + fdate(r.time) + '</small></div>' +
      '<div class="a"><button class="btn sm" data-cp="' + esc(r.address || '') + '"><i class="fa-solid fa-copy"></i> COPY</button>' +
      (s === 'p' ? '<button class="btn sm ok" data-wd="' + esc(r._k) + '" data-v="approved">APPROVE</button><button class="btn sm no" data-wd="' + esc(r._k) + '" data-v="rejected">REJECT</button>'
      : '<span class="tag t-' + s + '">' + (s === 'ok' ? 'APPROVED' : 'REJECTED · REFUNDED') + '</span>') + '</div></div>';
  }).join('') : '<div class="empty">No withdraw requests</div>';
}
function render(){
  const us = vals(D.users), ds = vals(D.deps), tours = vals(D.tours);
  // referral counts per referral code
  const byCode = {};
  us.forEach(u => { if(u.refBy){ const c = byCode[u.refBy] = byCode[u.refBy] || {ok:0, bad:0}; if((Number(u.deps) || 0) > 0) c.ok++; else c.bad++; } });
  let top = null; us.forEach(u => { const c = byCode[u.code]; if(c && c.ok > 0 && (!top || c.ok > top.ok || (c.ok === top.ok && c.bad > top.bad))) top = {name:u.name || 'User', ok:c.ok, bad:c.bad}; });
  const sum = {INR:0, USDT:0}; ds.filter(r => st(r) === 'ok').forEach(r => { if(sum[r.currency] != null) sum[r.currency] += Number(r.amount) || 0; });
  $('#stats').innerHTML = [
    ['TOTAL USER\'S', us.length, ''],
    ['TOTAL SUCCESSFUL DEPOSIT', '₹' + sum.INR.toFixed(2), '$' + sum.USDT.toFixed(2) + ' USDT'],
    ['TOTAL TOURNAMENTS', tours.length, ''],
    ['TOP REFERRAL USER', top ? top.name : '-', top ? top.ok + ' successful · ' + top.bad + ' unsuccessful' : 'No successful referral yet']
  ].map(a => '<div class="clay stat"><span>' + a[0] + '</span><b class="gt">' + esc(a[1]) + '</b><small>' + esc(a[2]) + '</small></div>').join('');

  const q = ($('#uSearch').value || '').toLowerCase();
  const list = us.filter(u => !q || [u.name, u.email, u.code].some(v => String(v || '').toLowerCase().includes(q))).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 300);
  $('#uCnt').textContent = list.length + ' of ' + us.length + ' users';
  $('#uList').innerHTML = list.length ? list.map(u => {
    const blk = u.blocked === true || u.isBlocked === true || String(u.status || '').toLowerCase() === 'blocked', c = byCode[u.code] || {ok:0, bad:0};
    return '<div class="item u"><div class="m"><b>' + esc(u.name || 'User') + '</b>' + (blk ? ' <span class="tag t-bad">BLOCKED</span>' : '') +
      '<small>EMAIL: ' + esc(u.email || '-') + '</small><small>AMOUNT: ' + (SYM[u.currency] || '') + (Number(u.balance) || 0).toFixed(2) + (u.currency ? ' ' + esc(u.currency) : '') + '</small>' +
      '<small>TOTAL REFERRAL: ' + (c.ok + c.bad) + ' · SUCCESSFUL ' + c.ok + ' · UNSUCCESSFUL ' + c.bad + ' · CODE ' + esc(u.code || '-') + '</small></div>' +
      '<div class="a"><button class="btn sm ' + (blk ? 'ok' : 'no') + '" data-blk="' + esc(u._k) + '" data-v="' + (blk ? '0' : '1') + '">' + (blk ? 'UNBLOCK' : 'BLOCK') + '</button><button class="btn sm no" data-deluser="' + esc(u._k) + '">DELETE USER</button></div></div>';
  }).join('') : '<div class="empty">No users</div>';

  $('#wdList').innerHTML = wdRows(); $('#inrList').innerHTML = depRows('INR'); $('#usdtList').innerHTML = depRows('USDT');

  tours.sort((a, b) => (b.startAt || 0) - (a.startAt || 0));
  const now = Date.now(), LM = 6 * 36e5;
  $('#toList').innerHTML = tours.length ? tours.map(t => {
    const en = Object.keys(t.entries || {}).map(k => t.entries[k]).sort((a, b) => (b.votes || 0) - (a.votes || 0) || (a.joinedAt || 0) - (b.joinedAt || 0));
    const ph = now < t.startAt ? 'UPCOMING' : (now < t.startAt + LM ? 'LIVE' : 'ENDED');
    const w = t.result && t.result.uid ? t.result.name : (ph === 'ENDED' && en[0] ? en[0].name : '');
    return '<div class="item u"><div style="display:flex;gap:12px;align-items:center"><div class="pimg">' + (okImg(t.img) ? '<img src="' + t.img + '" alt="">' : '<i class="fa-solid fa-trophy"></i>') + '</div>' +
      '<div class="m"><b>' + esc(t.tid) + '</b> <span class="tag ' + (ph === 'LIVE' ? 't-ok' : (ph === 'ENDED' ? 't-bad' : 't-p')) + '">' + ph + '</span>' +
      '<small>PRICE $' + esc(t.price) + ' · WINNER GETS $' + esc(t.prize) + ' · LIVE AT ' + fdate(t.startAt) + '</small>' +
      '<small>PLAYERS (' + en.length + '): ' + (en.map(e => esc(e.name || 'User') + ' ' + (e.votes || 0)).join(' · ') || 'none yet') + '</small>' +
      (w ? '<small>WINNER: ' + esc(w) + ' · PRIZE ' + (t.paid ? 'PAID' : 'NOT CLAIMED YET') + '</small>' : '') + '</div></div>' +
      '<div class="a"><button class="btn sm no" data-del="tournaments/' + esc(t._k) + '" data-what="tournament">DELETE</button></div></div>';
  }).join('') : '<div class="empty">No tournaments. Add one above.</div>';

  const aT = vals(D.aT).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  $('#aTasks').innerHTML = aT.length ? aT.map(t =>
    '<div class="item"><div class="m"><b>' + esc(t.title) + '</b><small>' + esc(t.url) + ' · ' + esc(t.reward) + ' coin · button ' + esc(t.btn) + '</small></div><div class="a"><button class="btn sm no" data-del="adminTasks/' + esc(t._k) + '" data-what="task">DELETE</button></div></div>').join('') : '<div class="empty">No task added yet</div>';
  const uT = vals(D.uT).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  $('#uTasks').innerHTML = uT.length ? uT.map(t =>
    '<div class="item"><div class="m"><b>' + esc(t.name || 'User') + ' · ' + (Number(t.done) || 0) + '/' + esc(t.qty) + ' users</b><small>' + esc(t.url) + '</small></div><div class="a"><button class="btn sm no" data-del="userTasks/' + esc(t._k) + '" data-what="task">REMOVE</button></div></div>').join('') : '<div class="empty">No user tasks</div>';
}
$('#uSearch').addEventListener('input', render);

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || !db) return;
  if(b.dataset.shot){
    toast('Loading screenshot...');
    db.ref('depShots/' + b.dataset.shot).once('value').then(s => { const v = s.val(); if(!okImg(v)) return toast('No screenshot found'); $('#shotView img').src = v; $('#shotView').classList.remove('hidden'); });
  }else if(b.dataset.dep){
    db.ref('depositRequests/' + b.dataset.dep).update({status: b.dataset.v, reviewedAt: Date.now()}).then(() => toast(b.dataset.v === 'approved' ? 'Approved' : 'Rejected'));
  }else if(b.dataset.wd){
    db.ref('withdrawRequests/' + b.dataset.wd).update({status: b.dataset.v, reviewedAt: Date.now()}).then(() => toast(b.dataset.v === 'approved' ? 'Withdrawal approved' : 'Withdrawal rejected. The user is refunded.'));
  }else if(b.dataset.cp){
    const t = b.dataset.cp, ok = () => toast('Address copied');
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, () => toast('Copy failed'));
    else{ const i = document.createElement('input'); i.value = t; document.body.appendChild(i); i.select(); try{ document.execCommand('copy'); ok(); }catch(x){ toast('Copy failed'); } i.remove(); }
  }else if(b.dataset.blk){
    const on = b.dataset.v === '1';
    db.ref('users/' + b.dataset.blk).update({blocked: on, isBlocked: on, status: on ? 'blocked' : 'active'}).then(() => toast(on ? 'User blocked' : 'User unblocked'));
  }else if(b.dataset.deluser){
    if(!confirm('Delete this user? Their account, plans and rewards will be removed.')) return;
    const id = b.dataset.deluser, upd = {}; upd['users/' + id] = null; upd['plans/' + id] = null; upd['refRewards/' + id] = null;
    db.ref().update(upd).then(() => toast('User deleted'));
  }else if(b.dataset.del){
    if(confirm('Delete this ' + (b.dataset.what || 'item') + '? It disappears from the app for every user.')) db.ref(b.dataset.del).remove().then(() => toast('Deleted'));
  }
});

/* ---- add tournament ---- */
let tImg = '';
function shrink(file, max, q, cb){
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => { const r = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement('canvas'); cv.width = Math.round(im.width * r); cv.height = Math.round(im.height * r); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); cb(cv.toDataURL('image/jpeg', q)); }; im.onerror = () => cb(''); im.src = rd.result; };
  rd.onerror = () => cb(''); rd.readAsDataURL(file);
}
$('#shotView').onclick = () => $('#shotView').classList.add('hidden');
$('#toPick').onclick = () => $('#toFile').click();
$('#toFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if(!f) return;
  shrink(f, 640, .72, d => { if(!d) return toast('This image cannot be read'); tImg = d; $('#toPrev').innerHTML = '<img src="' + d + '" alt="">'; });
  e.target.value = '';
});
$('#toAdd').onclick = () => {
  const tid = $('#toId').value.trim().toUpperCase().replace(/\s+/g, '-'), price = Number($('#toPrice').value.replace(/[^\d.]/g, '')), prize = Number($('#toPrize').value.replace(/[^\d.]/g, '')), start = new Date($('#toStart').value).getTime();
  if(tid.length < 3) return toast('Enter the tournament ID');
  if(vals(D.tours).some(t => String(t.tid).toUpperCase() === tid)) return toast('This tournament ID already exists');
  if(!(price > 0)) return toast('Enter the entry price in $');
  if(!(prize > 0)) return toast('Enter the winner prize in $');
  if(!(start > 0)) return toast('Select the live date and time');
  const rec = {tid, price: +price.toFixed(4), prize: +prize.toFixed(4), startAt: start, createdAt: Date.now()};
  if(tImg) rec.img = tImg;
  db.ref('tournaments').push(rec).then(() => {
    tImg = ''; $('#toPrev').innerHTML = '<i class="fa-solid fa-image"></i>'; ['#toId','#toPrice','#toPrize','#toStart'].forEach(x => $(x).value = '');
    toast('Tournament added. It shows in the app now.');
  }).catch(err => toast('Failed: ' + err.message));
};

/* ---- add task ---- */
$('#tAdd').onclick = () => {
  const title = $('#tTitle').value.trim(), url = $('#tUrl').value.trim(), rew = Math.floor(Number($('#tRew').value.replace(/[^\d]/g, ''))) || 0, btn = $('#tBtn').value.trim() || 'OPEN';
  if(title.length < 2) return toast('Enter the task title');
  if(!okUrl(url)) return toast('Enter a valid link starting with https://');
  if(rew < 1) return toast('Enter the reward in coins');
  db.ref('adminTasks').push({title, url, reward: rew, btn, createdAt: Date.now()}).then(() => {
    ['#tTitle','#tUrl','#tRew','#tBtn'].forEach(s => $(s).value = ''); toast('Task added. It shows on every user device.');
  }).catch(err => toast('Failed: ' + err.message));
};

try{ if(sessionStorage.getItem('sp_admin') === '1') openPanel(); else $('#login').classList.remove('hidden'); }catch(e){ $('#login').classList.remove('hidden'); }
})();
