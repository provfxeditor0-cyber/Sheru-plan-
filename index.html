<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
<style>
:root{--ink:#f6f2e4;--mut:#a3b3d2;--gold:#5eead4;--red:#ff7488;--ok:#38dba5;--em:#25c995;
--g-green:#22a06b;--g-green2:#3fd493;--g-red:#d64545;--g-red2:#ff7a7a;--g-violet:#8a4df0;--g-violet2:#b48aff;
--gl:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.05));--gb:1px solid rgba(255,255,255,.2);
--gs:0 16px 36px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.06);--in:inset 0 2px 8px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;font-family:'Manrope',system-ui,sans-serif;font-weight:700;color:var(--ink);background:#080620;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60vmax 50vmax at 0% 0%,rgba(37,201,149,.30),transparent 62%),radial-gradient(55vmax 55vmax at 100% 8%,rgba(94,234,212,.20),transparent 60%),radial-gradient(60vmax 60vmax at 80% 100%,rgba(70,90,220,.34),transparent 62%),linear-gradient(170deg,#0a1334,#080620 60%,#0b1a3a)}
button,input{font-family:inherit}
.hidden{display:none!important}
.gold-text{background:linear-gradient(180deg,#e6fff9,#5eead4 55%,#8f82ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold)}
.card,#side,#top,.item,.stat{background:var(--gl);border:var(--gb);box-shadow:var(--gs)}
.card,.item,.stat{position:relative;border-radius:26px}
.btn{border:0;cursor:pointer;font-weight:800;font-size:12px;letter-spacing:.6px;color:#05121f;border-radius:14px;padding:0 14px;height:36px;background:linear-gradient(135deg,#c7fbef,#5eead4 48%,#8f82ff);box-shadow:0 6px 14px rgba(143,130,255,.38),inset 0 1.5px 0 rgba(255,255,255,.85),inset 0 -3px 7px rgba(120,70,0,.35)}
.btn:active{transform:scale(.96)}.btn i{margin-right:5px}
.btn.ok{color:#04271b;background:linear-gradient(135deg,#9bf5d3,#25c995 55%,#128a64);box-shadow:0 6px 14px rgba(37,201,149,.35),inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -3px 7px rgba(0,80,50,.4)}
.btn.no{color:#3a0010;background:linear-gradient(135deg,#ffc2cb,#ff7488 55%,#d63a55);box-shadow:0 6px 14px rgba(214,58,85,.35),inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -3px 7px rgba(120,0,30,.35)}
.btn.gh{color:var(--ink);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn.sm{height:32px;font-size:11px;padding:0 12px;border-radius:12px}.btn.wide{width:100%;height:48px;font-size:14px;border-radius:18px}
.field{position:relative;margin-bottom:13px}
.field i.lead{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:15px;width:18px;text-align:center}
input[type=text],input[type=password],input[type=email]{width:100%;height:50px;border-radius:19px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.28);color:var(--ink);padding:0 18px;font-size:14px;font-weight:700;margin-bottom:12px;box-shadow:var(--in)}
.field input{padding:0 44px 0 46px;margin:0;height:52px;border-radius:20px}
input::placeholder{color:#7f90b3;font-weight:600}
input:focus{outline:0;border-color:var(--gold);box-shadow:var(--in),0 0 0 3px rgba(94,234,212,.28)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);width:38px;height:38px;cursor:pointer;font-size:15px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{width:100%;max-width:380px;padding:30px 24px;text-align:center;overflow:hidden}
.llogo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);box-shadow:0 0 0 5px rgba(94,234,212,.18),0 14px 30px rgba(0,0,0,.5);margin-bottom:8px}
.brand{font-family:'Sora',sans-serif;font-weight:800;font-size:22px;letter-spacing:3px;margin-bottom:12px}
.ltitle{font-family:'Sora',sans-serif;font-size:19px;letter-spacing:2px;margin-bottom:16px}
.lbtn{width:100%;height:52px;font-size:15px;border-radius:20px}
#top{position:fixed;top:0;left:0;right:0;height:56px;z-index:30;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:0 0 24px 24px}
.menu{width:40px;height:40px;border-radius:14px;border:var(--gb);background:rgba(255,255,255,.1);color:var(--gold);font-size:17px;cursor:pointer}
.tlogo{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}.tname{font-family:'Sora',sans-serif;font-weight:800;font-size:15px;letter-spacing:1.5px}
#side{position:fixed;top:0;bottom:0;left:0;width:270px;z-index:40;padding:18px 14px;display:flex;flex-direction:column;gap:6px;border-radius:0 30px 30px 0;transform:translateX(-105%);transition:transform .25s;background:linear-gradient(170deg,rgba(40,56,120,.96),rgba(10,18,48,.97));overflow-y:auto}
#side.open{transform:none}
#scrim{position:fixed;inset:0;z-index:35;background:rgba(2,6,20,.6);display:none}#scrim.show{display:block}
.sbrand{display:flex;align-items:center;gap:10px;margin:2px 4px 14px;font-family:'Sora',sans-serif;font-weight:800;letter-spacing:2px;font-size:16px}
.sbrand img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
#snav{display:flex;flex-direction:column;gap:6px}
#snav button,.sout{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 14px;border:1px solid transparent;border-radius:18px;background:none;color:var(--mut);font-weight:800;font-size:12px;letter-spacing:.6px;cursor:pointer;text-align:left}
#snav button i,.sout i{width:20px;text-align:center;font-size:15px}
#snav button em{margin-left:auto;font-style:normal;font-size:10px;min-width:20px;height:20px;border-radius:10px;display:none;align-items:center;justify-content:center;color:#3a0010;background:var(--red)}
#snav button em.on{display:flex}
#snav button.on{color:#05121f;background:linear-gradient(135deg,#c7fbef,#5eead4 50%,#8f82ff);box-shadow:0 6px 14px rgba(143,130,255,.4),inset 0 1.5px 0 rgba(255,255,255,.8)}
.sout{margin-top:auto;color:var(--red);border-color:rgba(255,116,136,.35)}
#main{max-width:980px;margin:0 auto;padding:76px 14px 40px}
#main h2{display:flex;align-items:center;gap:10px;font-family:'Sora',sans-serif;font-size:20px;letter-spacing:1px;margin-bottom:16px}
#main h2 i{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;font-size:15px;color:var(--gold);-webkit-text-fill-color:var(--gold);background:rgba(255,255,255,.1);box-shadow:var(--in)}
.box{padding:20px;margin-bottom:16px}.box h3{font-family:'Sora',sans-serif;font-size:14px;letter-spacing:1.2px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.stat{padding:18px;overflow:hidden}.stat .si{width:42px;height:42px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--gold);background:rgba(255,255,255,.1);box-shadow:var(--in);margin-bottom:10px}
.stat span{display:block;font-size:11px;color:var(--mut);letter-spacing:1.2px}.stat b{display:block;font-family:'Sora',sans-serif;font-size:22px;margin-top:4px;line-height:1.25;color:var(--gold)}.stat small{display:block;font-size:11.5px;color:var(--mut);margin-top:4px;line-height:1.5}
.item{padding:14px 16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.row+.row{margin-top:8px}
.row b{font-size:14px}.row small,.sub{font-size:11.5px;color:var(--mut);word-break:break-all;line-height:1.5}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addr{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 10px 10px 14px;border-radius:16px;background:rgba(0,0,0,.3);box-shadow:var(--in)}
.addr span{flex:1;font-size:12px;color:var(--gold);word-break:break-all;line-height:1.5}
.tag{font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:14px;white-space:nowrap}
.t-ok{color:var(--ok);background:rgba(56,219,165,.16)}.t-bad{color:var(--red);background:rgba(255,116,136,.16)}.t-p{color:#ffd77a;background:rgba(94,234,212,.18)}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:22px}
.up{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.pimg{flex:none;width:64px;height:64px;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--gold);background:rgba(255,255,255,.1);box-shadow:var(--in)}.pimg img{width:100%;height:100%;object-fit:cover}
.rank{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-size:13px;background:rgba(255,255,255,.12);color:var(--gold)}
.r1{background:linear-gradient(135deg,#ffe38a,#ffb020);color:#5a3600}.r2{background:linear-gradient(135deg,#f4f7fb,#b3c1d6);color:#2c3e57}.r3{background:linear-gradient(135deg,#ffd0a8,#e08a4a);color:#4a2400}
.adj{width:120px!important;height:36px!important;margin:0!important;border-radius:12px!important;font-size:12px!important;padding:0 10px!important}
.gtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.gtabs button{height:46px;border-radius:18px;border:var(--gb);background:var(--gl);color:var(--mut);font-weight:800;font-size:12px;cursor:pointer}
.gtabs button.on{color:#05121f;background:linear-gradient(135deg,#c7fbef,#5eead4 50%,#8f82ff);border-color:transparent}
.gper{font-family:'Sora',sans-serif;font-size:22px;font-weight:800;color:var(--gold);word-break:break-all;margin:6px 0}
.balls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ball{display:inline-flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;color:var(--mut)}
.ball b{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;color:#fff;font-family:'Sora',sans-serif;font-size:18px;text-shadow:0 2px 3px rgba(0,0,0,.45);box-shadow:0 5px 10px rgba(0,0,0,.4),inset 0 3px 5px rgba(255,255,255,.55),inset 0 -4px 7px rgba(0,0,0,.28)}
.b1 b,.b3 b,.b7 b,.b9 b{background:radial-gradient(circle at 30% 25%,#7bf0b8,var(--g-green))}.b2 b,.b4 b,.b6 b,.b8 b{background:radial-gradient(circle at 30% 25%,#ff9a9a,var(--g-red))}
.b0 b{background:linear-gradient(135deg,var(--g-red2) 50%,var(--g-violet2) 50%)}.b5 b{background:linear-gradient(135deg,var(--g-green2) 50%,var(--g-violet2) 50%)}
.note{margin-top:14px;padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.28);font-size:12px;color:var(--mut);line-height:1.6}
#shotView{position:fixed;inset:0;z-index:70;background:rgba(2,6,20,.88);display:flex;align-items:center;justify-content:center;padding:14px;cursor:zoom-out}#shotView img{max-width:100%;max-height:100%;border-radius:18px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);padding:13px 22px;border-radius:26px;background:rgba(16,26,62,.95);font-size:13px;font-weight:800;border:var(--gb);box-shadow:var(--gs);opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90%;text-align:center}#toast.show{opacity:1}
@media (min-width:900px){#side{transform:none;border-radius:0 30px 30px 0}.menu,#scrim{display:none!important}#top{left:270px;border-radius:0 0 24px 24px}#main{margin-left:270px;margin-right:0;max-width:none;padding:76px 28px 40px}}

#main>section{max-width:980px}

.llogo,.tlogo,.sbrand img{border-radius:26%}.btn:disabled{filter:grayscale(.55) opacity(.6);cursor:not-allowed}.gtabs.c3{grid-template-columns:repeat(3,1fr)}
</style>
</head>

/* ---------------- money helpers ---------------- */
function adjBal(uid, delta, done){

const tot = arr => { const t = {USDT:0, INR:0}; arr.forEach(r => { const c = r.currency === 'INR' ? 'INR' : 'USDT'; t[c] += Number(r.amount) || 0; }); return t; };
const totTxt = t => '$' + t.USDT.toFixed(2) + (t.INR ? '  +  ₹' + t.INR.toFixed(2) : '');

/* ---------------- referrals ---------------- */
function refStats(){
  const us = vals(D.users), byCode = {}, okUid = new Set(vals(D.users).filter(u => Number(u.deps) > 0).map(u => u._k));
  us.forEach(u => { if(u.code) byCode[u.code] = u; });
  const by = {}; let total = 0, ok = 0, bad = 0;
  us.forEach(u => {
    if(!u.refBy) return;
    total++; const good = okUid.has(u._k); good ? ok++ : bad++;
    const r = byCode[u.refBy]; if(!r) return;
    const o = by[r._k] = by[r._k] || {name:r.name, email:r.email, ok:0, bad:0}; good ? o.ok++ : o.bad++;
  });
  return {total, ok, bad, list:Object.keys(by).map(k => by[k]).sort((a, b) => b.ok - a.ok || (b.ok + b.bad) - (a.ok + a.bad))};
}

/* ---------------- render ---------------- */

}
function rDash(){
  const us = vals(D.users), ws = vals(D.wds), rs = refStats(), okW = ws.filter(r => st(r) === 'ok'), cs = [];

    ['fa-gift', 'GIFT CARD CODES', (cs.length - used) + ' available', used + ' used'],
    ['fa-list-check', 'TASKS', vals(D.tasks).length, 'tasks added'],

  ];
  $('#stats').innerHTML = T.map(t => '<div class="stat"><div class="si"><i class="fa-solid ' + t[0] + '"></i></div><span>' + t[1] + '</span><b>' + esc(t[2]) + '</b><small>' + esc(t[3]) + '</small></div>').join('');
}

      '<div class="acts">' + (s === 'p' ? '<button class="btn sm ok" data-wd="' + esc(r._k) + '" data-v="approved"><i class="fa-solid fa-check"></i>APPROVE</button><button class="btn sm no" data-wd="' + esc(r._k) + '" data-v="rejected"><i class="fa-solid fa-xmark"></i>REJECT</button>' : '') +
      '<button class="btn sm gh" data-wdel="' + esc(r._k) + '"><i class="fa-solid fa-trash"></i>DELETE</button></div></div>';
  }).join('') : '<div class="card empty">No withdraw requests</div>';
}

      '<div style="min-width:0"><b>' + esc(t.title) + '</b><div class="sub">' + esc(t.url) + '</div><div class="sub">REWARD $' + esc(+ru.toFixed(8)) + ' · BUTTON ' + esc(t.btn || 'OPEN') + '</div></div></div>' +
      '<button class="btn sm no" data-tdel="' + esc(t._k) + '"><i class="fa-solid fa-trash"></i>DELETE</button></div></div>';

function rTop(){
  const rs = refStats();
  $('#topList').innerHTML = rs.list.length ? rs.list.map((u, i) =>
    '<div class="item"><div class="row" style="flex-wrap:nowrap"><div style="display:flex;gap:12px;align-items:center;min-width:0"><span class="rank r' + (i < 3 ? i + 1 : 0) + '">' + (i + 1) + '</span><div style="min-width:0"><b>' + esc(u.name || 'User') + '</b><div class="sub">' + esc(u.email || '') + '</div></div></div>' +

function rUsers(){
  const keep = {}; $$('.adj').forEach(i => { keep[i.dataset.uid] = i.value; });
  const q = $('#uSearch').value.trim().toLowerCase();
  const a = vals(D.users).filter(u => !q || String(u.name || '').toLowerCase().includes(q) || String(u.email || '').toLowerCase().includes(q)).sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0)).slice(0, 300);

      '<div style="text-align:right"><b style="color:var(--gold)">' + sym(c) + (Number(u.balance) || 0).toFixed(c === 'INR' ? 2 : 4) + '</b><div class="sub">' + (u.currency || 'no currency yet') + '</div></div></div>' +

/* ---------------- manage game (live period + results; results are random and the same on every device) ---------------- */
let gSel = 0;
const IST = 5.5 * 3600e3, gpad = (v, n) => String(v).padStart(n, '0');
function roundOf(now, game){
  const d = new Date(now + IST), sec = d.getUTCHours() * 3600 + d.getUTCMinutes() * 60 + d.getUTCSeconds(), slot = Math.floor(sec / game.secs);
  const dk = '' + d.getUTCFullYear() + gpad(d.getUTCMonth() + 1, 2) + gpad(d.getUTCDate(), 2);
  return {slot, dk, period:dk + game.code + gpad(slot, 4), prev:slot > 0 ? dk + game.code + gpad(slot - 1, 4) : '', left:game.secs - 1 - (sec % game.secs)};
}
function rGame(){
  $('#gTabs').innerHTML = GAMES.map((g, i) => '<button data-g="' + i + '" class="' + (i === gSel ? 'on' : '') + '">' + g.name.replace('WINGO ', '') + '</button>').join('');
  const g = GAMES[gSel], now = Date.now(), r = roundOf(now, g), res = D.game[g.code] || {}, nx = D.next[g.code] || {};
  const keys = Object.keys(res).sort().reverse().slice(0, 15);
  const up = [0, 1, 2].map(i => { const p = roundOf(now + i * g.secs * 1000, g).period, v = nx[p]; return '<div class="ball b' + (v === undefined ? '' : v) + '"><b>' + (v === undefined ? '?' : v) + '</b>' + (i ? 'NEXT +' + i : 'NOW') + '</div>'; }).join('');
  $('#gBox').innerHTML = '<h3 class="gold-text">' + g.name + '</h3><div class="sub">LIVE GAME PERIOD NUMBER</div><div class="gper" id="gPer">' + r.period + '</div><div class="sub">Time left: <b id="gLeft" style="color:var(--gold)">' + r.left + 's</b></div>' +
    '<h3 class="gold-text" style="margin-top:18px">UPCOMING RESULT</h3><div class="balls">' + up + '</div>' +
    '<h3 class="gold-text" style="margin-top:18px">LAST RESULTS</h3>' + (keys.length ? '<div class="balls">' + keys.map(k => '<div class="ball b' + res[k] + '"><b>' + res[k] + '</b>' + k.slice(-4) + '</div>').join('') + '</div>' : '<div class="sub">No results yet</div>') +
    '<div class="note"><i class="fa-solid fa-shield-halved"></i> The upcoming result is picked at random and saved once. You can see it here but it cannot be changed. Keep it private.</div>';
  rCards();
}
$('#gTabs').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if(b){ gSel = +b.dataset.g; rGame(); } });
const gBusy = {};
setInterval(() => {                                   // while this panel is open it prepares the next 3 results and saves finished periods
  if(!started || !db) return;
  const now = Date.now();
  GAMES.forEach(g => {
    [0, 1, 2].forEach(i => {
      const p = roundOf(now + i * g.secs * 1000, g).period, k = g.code + p;
      if((D.next[g.code] || {})[p] !== undefined || gBusy[k]) return; gBusy[k] = 1;
      db.ref('gameNext/' + g.code + '/' + p).transaction(c => (c === null || c === undefined) ? Math.floor(Math.random() * 10) : undefined, () => { delete gBusy[k]; }, false);
    });
    const r = roundOf(now, g); if(!r.prev || (D.game[g.code] || {})[r.prev] !== undefined || gBusy['r' + r.prev]) return;
    gBusy['r' + r.prev] = 1; const nv = (D.next[g.code] || {})[r.prev];
    db.ref('gameResults/' + g.code + '/' + r.prev).transaction(c => (c === null || c === undefined) ? (nv !== undefined ? Number(nv) : Math.floor(Math.random() * 10)) : undefined, () => { delete gBusy['r' + r.prev]; }, false);
  });
  if(cur === 'game'){ const r = roundOf(now, GAMES[gSel]); const p = $('#gPer'), l = $('#gLeft'); if(p) p.textContent = r.period; if(l) l.textContent = r.left + 's'; }
}, 1000);

/* ---------------- actions ---------------- */
function shrink(file, max, q, cb){
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => { const r = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement('canvas'); cv.width = Math.round(im.width * r); cv.height = Math.round(im.height * r); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); cb(cv.toDataURL('image/jpeg', q)); }; im.onerror = () => cb(''); im.src = rd.result; };
  rd.onerror = () => cb(''); rd.readAsDataURL(file);
}
$('#main').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || !db) return;
  const d = b.dataset;
  if(d.wd){
    db.ref('withdrawRequests/' + d.wd).update({status:d.v, reviewedAt:Date.now()}).then(() => toast(d.v === 'approved' ? 'Withdrawal approved' : 'Withdrawal rejected. The user is refunded.'));
  }else if(d.wdel){
    const r = D.wds[d.wdel] || {}, owe = st(r) !== 'ok' && r.refunded !== true && r.uid;
    if(!confirm(owe ? 'This withdrawal was not paid. The amount will be returned to the user and the request deleted. Continue?' : 'Delete this withdraw request?')) return;
    const fin = () => { db.ref('withdrawRequests/' + d.wdel).remove(); toast('Withdraw request deleted'); };
    if(owe) adjBal(r.uid, Number(r.amount) || 0, ok => ok ? fin() : toast('Could not refund. Nothing deleted.')); else fin();
  }else if(d.cp){
    const t = d.cp, ok = () => toast('Copied');
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, () => toast('Copy failed'));
    else{ const i = document.createElement('input'); i.value = t; document.body.appendChild(i); i.select(); try{ document.execCommand('copy'); ok(); }catch(x){ toast('Copy failed'); } i.remove(); }
  }else if(d.tdel){
    if(confirm('Delete this task?')) db.ref('adminTasks/' + d.tdel).remove().then(() => toast('Task deleted'));
  }else if(d.inc || d.dec){
    const uid = d.inc || d.dec, inp = $('.adj[data-uid="' + uid + '"]'), n = Number((inp ? inp.value : '').replace(/[^\d.]/g, ''));
    if(!(n > 0)) return toast('Enter an amount');
    adjBal(uid, d.inc ? n : -n, ok => { if(ok){ if(inp) inp.value = ''; toast(d.inc ? 'Balance increased' : 'Balance decreased'); } else toast('Not enough balance to decrease'); });
  }else if(d.blk){
    const on = d.v === '1';
    db.ref('users/' + d.blk).update({blocked:on, isBlocked:on, status:on ? 'blocked' : 'active'}).then(() => toast(on ? 'User blocked' : 'User unblocked'));
  }else if(d.udel){
    if(confirm('Delete this user? The account is removed from the app.')) db.ref('users/' + d.udel).remove().then(() => toast('User deleted'));
  }
});

/* ---------------- add task ---------------- */
let tImg = '';
$('#tPick').onclick = () => $('#tFile').click();
$('#tFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if(!f) return;
  shrink(f, 160, .75, d => { if(!d) return toast('This image cannot be read'); tImg = d; $('#tPrev').innerHTML = '<img src="' + d + '" alt="">'; });
  e.target.value = '';
});
$('#tAdd').onclick = () => {
  if(!db) return toast('Connecting... try again');
  const title = $('#tName').value.trim(), url = $('#tUrl').value.trim(), rew = Number($('#tRew').value.replace(/[^\d.]/g, '')), btn = ($('#tBtn').value.trim() || 'OPEN').toUpperCase();
  if(title.length < 2) return toast('Enter the task name');
  if(!okUrl(url)) return toast('Enter a valid link starting with https://');
  if(!(rew > 0)) return toast('Enter the reward in USDT');
  const rec = {title, url, rewardU:+rew.toFixed(8), btn, createdAt:Date.now()};
  if(tImg) rec.img = tImg;
  db.ref('adminTasks').push(rec).then(() => {
    tImg = ''; $('#tPrev').innerHTML = '<i class="fa-solid fa-image"></i>'; ['#tName','#tUrl','#tRew','#tBtn'].forEach(x => $(x).value = '');
    toast('Task added. It shows in the app now.');
  }).catch(err => toast('Failed: ' + err.message));
};

/* ---------------- gift cards: ADD CARD ---------------- */
let cSel = 1; const CP = [10, 20, 40, 50, 80, 100];
function rCards(){
  $('#cSel').innerHTML = CP.map((p, i) => '<button data-csel="' + (i + 1) + '" class="' + (cSel === i + 1 ? 'on' : '') + '">CARD ' + (i + 1) + '</button>').join('');
  $('#cList').innerHTML = CP.map((p, i) => {
    const arr = vals(D.cards['c' + (i + 1)]).sort((x, y) => (x.addedAt || 0) - (y.addedAt || 0));
    return '<h3 class="gold-text" style="margin:16px 0 8px">CARD ' + (i + 1) + ' · ₹' + p + '</h3>' + (arr.length ? arr.map(c =>
      '<div class="item"><div class="row"><b style="word-break:break-all">' + esc(c.code) + '</b><span class="tag t-' + (c.used ? 'bad' : 'ok') + '">' + (c.used ? 'USED' : 'AVAILABLE') + '</span></div>' +
      (c.used ? '<div class="sub">' + esc(c.usedName || '') + ' · ' + fdate(c.usedAt) + '</div>' : '') +
      '<div class="acts"><button class="btn sm gh" data-cp="' + esc(c.code) + '"><i class="fa-solid fa-copy"></i>COPY</button><button class="btn sm no" data-cdel="c' + (i + 1) + '/' + esc(c._k) + '"><i class="fa-solid fa-trash"></i>DELETE</button></div></div>').join('') : '<div class="sub">No codes added</div>');
  }).join('');
}
$('#cardBox').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || !db) return; const d = b.dataset;
  if(d.csel){ cSel = +d.csel; rCards(); }
  else if(d.cdel){ if(confirm('Delete this code?')) db.ref('giftCards/' + d.cdel).remove().then(() => toast('Code deleted')); }
  else if(b.id === 'cAdd'){
    const code = $('#cCode').value.trim();
    if(code.length < 4) return toast('Enter the code');
    if(Object.keys(D.cards).some(k => vals(D.cards[k]).some(c => c.code === code))) return toast('This code is already added');
    db.ref('giftCards/c' + cSel).push({code: code, used: false, addedAt: Date.now()})
      .then(() => { $('#cCode').value = ''; toast('Code added to CARD ' + cSel + '. It shows in the app now.'); })
      .catch(err => toast('Failed: ' + err.message));
  }
});

/* ---------------- boot ---------------- */
try{ if(localStorage.getItem('aw_admin') === '1') openPanel(); }catch(e){}
})();
